name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    name: Skill metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate SKILL.md frontmatter
        run: bash tests/validate-skills.sh

      # The frontmatter check above cannot catch YAML that parses as the wrong
      # type (e.g. an unquoted `argument-hint: [FOO] [--bar]` becomes a flow
      # sequence and the CLI skips the whole skill). Ask the CLI what it sees.
      - name: Verify the skills CLI discovers every skill
        run: bash tests/validate-cli-discovery.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@master
